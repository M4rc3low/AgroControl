[package]
name = "agrocontrol-desktop"
version = "0.20.0"
description = "AgroControl desktop shell"
authors = ["AgroControl"]
edition = "2021"

[lib]
name = "agrocontrol_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
