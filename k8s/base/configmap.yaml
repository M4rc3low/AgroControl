apiVersion: v1
kind: ConfigMap
metadata:
  name: agrocontrol-config
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  Database__ApplyMigrations: "false"
  Intelligence__BaseUrl: http://agrocontrol-intelligence:8090
  Intelligence__TimeoutSeconds: "5"
  Telemetry__BaseUrl: http://agrocontrol-telemetry:8100
  Telemetry__TimeoutSeconds: "5"
  Observability__Enabled: "false"
  Observability__ServiceName: AgroControl.Api
  OTEL_ENABLED: "false"
  OTEL_SERVICE_NAME: AgroControl.Intelligence
  TELEMETRY_MQTT_ENABLED: "true"
  TELEMETRY_MQTT_QOS: "1"
