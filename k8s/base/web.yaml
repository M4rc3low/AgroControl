apiVersion: apps/v1
kind: Deployment
metadata:
  name: agrocontrol-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agrocontrol-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agrocontrol-web
        app.kubernetes.io/part-of: agrocontrol
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: web
          image: ghcr.io/m4rc3low/agrocontrol-web:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: agrocontrol-api:8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: agrocontrol-web
spec:
  selector:
    app.kubernetes.io/name: agrocontrol-web
  ports:
    - name: http
      port: 80
      targetPort: http
