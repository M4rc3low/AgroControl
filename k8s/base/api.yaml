apiVersion: apps/v1
kind: Deployment
metadata:
  name: agrocontrol-api
  labels:
    app.kubernetes.io/name: agrocontrol-api
    app.kubernetes.io/part-of: agrocontrol
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agrocontrol-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agrocontrol-api
        app.kubernetes.io/part-of: agrocontrol
    spec:
      containers:
        - name: api
          image: ghcr.io/m4rc3low/agrocontrol-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: agrocontrol-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: agrocontrol-secrets
                  key: database-connection-string
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: agrocontrol-secrets
                  key: jwt-key
            - name: Telemetry__InternalApiKey
              valueFrom:
                secretKeyRef:
                  name: agrocontrol-secrets
                  key: telemetry-internal-api-key
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: agrocontrol-api
spec:
  selector:
    app.kubernetes.io/name: agrocontrol-api
  ports:
    - name: http
      port: 8080
      targetPort: http
