services:
  postgres:
    image: postgres:17-alpine
    container_name: agrocontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrocontrol}
      POSTGRES_USER: ${POSTGRES_USER:-agrocontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrocontrol_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agrocontrol_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrocontrol} -d ${POSTGRES_DB:-agrocontrol}"]
      interval: 5s
      timeout: 5s
      retries: 10

  telemetry-db:
    image: postgres:17-alpine
    container_name: agrocontrol-telemetry-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrocontrol_telemetry
      POSTGRES_USER: ${TELEMETRY_DB_USER:-agrocontrol_telemetry}
      POSTGRES_PASSWORD: ${TELEMETRY_DB_PASSWORD:-agrocontrol_telemetry_dev}
    ports:
      - "${TELEMETRY_DB_PORT:-5433}:5432"
    volumes:
      - agrocontrol_telemetry_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TELEMETRY_DB_USER:-agrocontrol_telemetry} -d agrocontrol_telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: agrocontrol-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  telemetry:
    build:
      context: .
      dockerfile: src/telemetry/Dockerfile
    container_name: agrocontrol-telemetry
    restart: unless-stopped
    environment:
      TELEMETRY_DB_URL: jdbc:postgresql://telemetry-db:5432/agrocontrol_telemetry
      TELEMETRY_DB_USER: ${TELEMETRY_DB_USER:-agrocontrol_telemetry}
      TELEMETRY_DB_PASSWORD: ${TELEMETRY_DB_PASSWORD:-agrocontrol_telemetry_dev}
      TELEMETRY_INTERNAL_API_KEY: ${TELEMETRY_INTERNAL_API_KEY:-development-only-telemetry-internal-key-change-me}
      TELEMETRY_MQTT_BROKER_URL: tcp://mosquitto:1883
      TELEMETRY_MQTT_ENABLED: "true"
    ports:
      - "${TELEMETRY_PORT:-8100}:8100"
    depends_on:
      telemetry-db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8100/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  intelligence:
    build:
      context: .
      dockerfile: src/intelligence/Dockerfile
    container_name: agrocontrol-intelligence
    restart: unless-stopped
    ports:
      - "${INTELLIGENCE_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/backend/AgroControl.Api/Dockerfile
    container_name: agrocontrol-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ApplyMigrations: "true"
      Jwt__Key: ${JWT_KEY:-development-only-agrocontrol-key-change-before-production-2026}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-agrocontrol};Username=${POSTGRES_USER:-agrocontrol};Password=${POSTGRES_PASSWORD:-agrocontrol_dev}
      Intelligence__BaseUrl: http://intelligence:8090
      Intelligence__TimeoutSeconds: ${INTELLIGENCE_TIMEOUT_SECONDS:-5}
      Telemetry__BaseUrl: http://telemetry:8100
      Telemetry__TimeoutSeconds: ${TELEMETRY_TIMEOUT_SECONDS:-5}
      Telemetry__InternalApiKey: ${TELEMETRY_INTERNAL_API_KEY:-development-only-telemetry-internal-key-change-me}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      intelligence:
        condition: service_healthy
      telemetry:
        condition: service_healthy

volumes:
  agrocontrol_postgres_data:
  agrocontrol_telemetry_data:
