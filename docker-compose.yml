services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: agrocontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrocontrol}
      POSTGRES_USER: ${POSTGRES_USER:-agrocontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrocontrol_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agrocontrol_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrocontrol} -d ${POSTGRES_DB:-agrocontrol}"]
      interval: 5s
      timeout: 5s
      retries: 10

  telemetry-db:
    image: postgres:17-alpine
    container_name: agrocontrol-telemetry-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrocontrol_telemetry
      POSTGRES_USER: ${TELEMETRY_DB_USER:-agrocontrol_telemetry}
      POSTGRES_PASSWORD: ${TELEMETRY_DB_PASSWORD:-agrocontrol_telemetry_dev}
    ports:
      - "${TELEMETRY_DB_PORT:-5433}:5432"
    volumes:
      - agrocontrol_telemetry_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TELEMETRY_DB_USER:-agrocontrol_telemetry} -d agrocontrol_telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: agrocontrol-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  telemetry:
    build:
      context: .
      dockerfile: src/telemetry/Dockerfile
    container_name: agrocontrol-telemetry
    restart: unless-stopped
    environment:
      TELEMETRY_DB_URL: jdbc:postgresql://telemetry-db:5432/agrocontrol_telemetry
      TELEMETRY_DB_USER: ${TELEMETRY_DB_USER:-agrocontrol_telemetry}
      TELEMETRY_DB_PASSWORD: ${TELEMETRY_DB_PASSWORD:-agrocontrol_telemetry_dev}
      TELEMETRY_INTERNAL_API_KEY: ${TELEMETRY_INTERNAL_API_KEY:-development-only-telemetry-internal-key-change-me}
      TELEMETRY_MQTT_BROKER_URL: tcp://mosquitto:1883
      TELEMETRY_MQTT_ENABLED: "true"
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_TRACES_SAMPLER_PROBABILITY: ${OTEL_TRACES_SAMPLER_PROBABILITY:-1.0}
    ports:
      - "${TELEMETRY_PORT:-8100}:8100"
    depends_on:
      telemetry-db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8100/actuator/health/readiness >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  intelligence:
    build:
      context: .
      dockerfile: src/intelligence/Dockerfile
    container_name: agrocontrol-intelligence
    restart: unless-stopped
    environment:
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: AgroControl.Intelligence
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "${INTELLIGENCE_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health/ready', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/backend/AgroControl.Api/Dockerfile
    container_name: agrocontrol-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ApplyMigrations: "true"
      Jwt__Key: ${JWT_KEY:-development-only-agrocontrol-key-change-before-production-2026}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-agrocontrol};Username=${POSTGRES_USER:-agrocontrol};Password=${POSTGRES_PASSWORD:-agrocontrol_dev}
      Intelligence__BaseUrl: http://intelligence:8090
      Intelligence__TimeoutSeconds: ${INTELLIGENCE_TIMEOUT_SECONDS:-5}
      Telemetry__BaseUrl: http://telemetry:8100
      Telemetry__TimeoutSeconds: ${TELEMETRY_TIMEOUT_SECONDS:-5}
      Telemetry__InternalApiKey: ${TELEMETRY_INTERNAL_API_KEY:-development-only-telemetry-internal-key-change-me}
      Observability__Enabled: ${OTEL_ENABLED:-false}
      Observability__ServiceName: AgroControl.Api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      intelligence:
        condition: service_healthy
      telemetry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      args:
        VITE_MAPLIBRE_SCRIPT_URL: ${VITE_MAPLIBRE_SCRIPT_URL:-}
        VITE_MAPLIBRE_CSS_URL: ${VITE_MAPLIBRE_CSS_URL:-}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-}
    container_name: agrocontrol-web
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8080
    ports:
      - "${WEB_PORT:-3001}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  tempo:
    image: grafana/tempo:2.7.2
    container_name: agrocontrol-tempo
    command: ["-config.file=/etc/tempo.yml"]
    profiles: ["observability"]
    volumes:
      - ./infra/observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - agrocontrol_tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: agrocontrol-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    profiles: ["observability"]
    volumes:
      - ./infra/observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_PROMETHEUS_PORT:-9464}:9464"
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: agrocontrol-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - agrocontrol_prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - otel-collector
      - telemetry

  grafana:
    image: grafana/grafana:11.5.0
    container_name: agrocontrol-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-agrocontrol_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - agrocontrol_grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  agrocontrol_postgres_data:
  agrocontrol_telemetry_data:
  agrocontrol_tempo_data:
  agrocontrol_prometheus_data:
  agrocontrol_grafana_data:
