name: Sprint 13 Polish

on:
  push:
    branches: ["feat/sprint-13-export"]
    paths: [".github/workflows/sprint13-polish.yml"]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sprint-13-export
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Finalize docs and export UI
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'marker not found: {path}: {old[:120]}')
              p.write_text(s.replace(old, new, 1))

          replace('README.md',
              '> Status atual: **Sprint 12 concluída — Sustentabilidade, emissões estimadas e indicadores de CO₂e**',
              '> Status atual: **Sprint 13 concluída — Exportação, câmbio, documentos e logística internacional**')
          replace('README.md',
              '- evolução futura para exportação, sensoriamento remoto e análises agronômicas avançadas.',
              '- pedidos de exportação, câmbio, documentação e custos logísticos;\n- evolução futura para sensoriamento remoto, CRM e análises agronômicas avançadas.')
          replace('README.md',
              '- workspace de sustentabilidade com fatores de emissão, ledger de atividades, CO₂e e composição por categoria;\n- layout para desktop, tablet e mobile;',
              '- workspace de sustentabilidade com fatores de emissão, ledger de atividades, CO₂e e composição por categoria;\n- workspace de exportação com pedidos, câmbio, logística, custos, documentos e timeline operacional;\n- layout para desktop, tablet e mobile;')

          sustainability_marker = 'Os indicadores de sustentabilidade são **estimativas gerenciais e apoio à decisão**. O AgroControl não certifica inventários, não executa auditoria ambiental e não emite, certifica ou comercializa créditos de carbono.\n\n### Estoque'
          export_section = '''Os indicadores de sustentabilidade são **estimativas gerenciais e apoio à decisão**. O AgroControl não certifica inventários, não executa auditoria ambiental e não emite, certifica ou comercializa créditos de carbono.\n\n### Exportação\n\n- pedidos internacionais com número único por organização;\n- comprador, país de destino, produto, quantidade, unidade e vínculo opcional com propriedade/talhão/cultura/safra;\n- moedas ISO 4217, preço unitário e snapshot da taxa de câmbio para BRL;\n- Incoterms e fluxo `Draft`, `Negotiation`, `Contracted`, `InTransit`, `Delivered` e `Cancelled`;\n- timeline append-only das mudanças de status;\n- origem, destino, booking, container e referências de embarque;\n- checklist de Commercial Invoice, Packing List, Certificate of Origin, Phytosanitary Certificate e Bill of Lading;\n- custos de frete, seguro, porto, aduana, inspeção e outros com snapshot cambial;\n- resumo por período, status, país e moeda, com valor comercial, custos e margem operacional estimada;\n- isolamento multi-tenant e proteção pelo entitlement `Export`.\n\nO módulo é **operacional e gerencial**. Não substitui Siscomex, despachante aduaneiro, emissão fiscal, contratação bancária de câmbio ou documentos oficiais.\n\n### Estoque'''
          replace('README.md', sustainability_marker, export_section)
          replace('README.md',
              '/api/v1/sustainability/*\n/api/v1/inventory/*',
              '/api/v1/sustainability/*\n/api/v1/export/*\n/api/v1/inventory/*')
          replace('README.md',
              '- [`docs/SPRINT_12_SUSTAINABILITY.md`](docs/SPRINT_12_SUSTAINABILITY.md)\n- [`docs/ROADMAP.md`](docs/ROADMAP.md)',
              '- [`docs/SPRINT_12_SUSTAINABILITY.md`](docs/SPRINT_12_SUSTAINABILITY.md)\n- [`docs/SPRINT_13_EXPORT.md`](docs/SPRINT_13_EXPORT.md)\n- [`docs/ROADMAP.md`](docs/ROADMAP.md)')
          replace('README.md',
              '13. ✅ **Sprint 12** — sustentabilidade, fatores de emissão, CO₂e e indicadores ambientais.\n\nO hardening',
              '13. ✅ **Sprint 12** — sustentabilidade, fatores de emissão, CO₂e e indicadores ambientais.\n14. ✅ **Sprint 13** — exportação, câmbio, documentos, logística e custos internacionais.\n\nO hardening')

          roadmap_section = '''## Sprint 13 — Exportação ✅\n\n- [x] pedidos de exportação isolados por organização e número único por tenant;\n- [x] comprador, país ISO alpha-2, produto, quantidade e unidade;\n- [x] vínculo opcional e consistente com Farm, Field, Crop e Season;\n- [x] moeda ISO 4217, preço unitário e snapshot de câmbio para BRL;\n- [x] Incoterms e regras explícitas de transição de status;\n- [x] timeline operacional append-only;\n- [x] origem, destino, shipment, booking e container;\n- [x] checklist documental e metadados de emissão;\n- [x] custos logísticos com moeda e snapshot cambial;\n- [x] resumo por período, status, país e moeda;\n- [x] interface web responsiva para pedidos, documentos, timeline e custos;\n- [x] API protegida pelo entitlement `Export` e isolamento multi-tenant;\n- [x] migration `ExportCore` e índices;\n- [x] testes unitários e integração PostgreSQL;\n- [x] documentação da Sprint 13.\n\n## Próximos aprimoramentos'''
          replace('docs/ROADMAP.md', '## Próximos aprimoramentos', roadmap_section)
          replace('docs/ROADMAP.md',
              'As próximas evoluções funcionais podem avançar para exportação e logística comercial, importação de geometrias, imagens de satélite/drone, índices vegetativos, zonas de manejo e aprofundamento agronômico do balanço hídrico, mantendo cada responsabilidade em uma sprint separada.',
              'As próximas evoluções funcionais podem avançar para CRM/comercial, importação de geometrias, imagens de satélite/drone, índices vegetativos, zonas de manejo e aprofundamento agronômico do balanço hídrico, mantendo cada responsabilidade em uma sprint separada.')

          replace('src/frontend/src/pages/ExportPage.tsx',
              '{String(order.incoterm)} · {order.currency}',
              '{incoterms[enumNumber(order.incoterm, incoterms) - 1] ?? String(order.incoterm)} · {order.currency}')
          PY
      - name: Validate frontend
        working-directory: src/frontend
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md src/frontend/src/pages/ExportPage.tsx
          git commit -m "docs: finalize Sprint 13 export delivery"
          git push origin HEAD:feat/sprint-13-export
