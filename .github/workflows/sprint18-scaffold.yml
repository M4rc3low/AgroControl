name: Sprint 18 Scaffold

on:
  push:
    branches: ["feat/sprint-18-multi-farm"]
    paths: [".github/workflows/sprint18-scaffold.yml"]

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sprint-18-multi-farm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Wire multi-farm persistence and services
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'marker not found in {path}: {old[:100]}')
              p.write_text(s.replace(old, new, 1))

          # DbContext imports and DbSets
          replace(
              'src/backend/AgroControl.Infrastructure/Persistence/AgroControlDbContext.cs',
              'using AgroControl.Domain.Modules.Organizations;\n',
              'using AgroControl.Domain.Modules.Organizations;\nusing AgroControl.Domain.Modules.Operations;\n')
          replace(
              'src/backend/AgroControl.Infrastructure/Persistence/AgroControlDbContext.cs',
              '    public DbSet<OrganizationMembership> OrganizationMemberships => Set<OrganizationMembership>();\n',
              '    public DbSet<OrganizationMembership> OrganizationMemberships => Set<OrganizationMembership>();\n    public DbSet<OperationalRegion> OperationalRegions => Set<OperationalRegion>();\n    public DbSet<FarmAccessAssignment> FarmAccessAssignments => Set<FarmAccessAssignment>();\n')

          # New model mappings before Subscription
          marker = '''        modelBuilder.Entity<Subscription>(entity =>\n        {\n'''
          mapping = '''        modelBuilder.Entity<OperationalRegion>(entity =>\n        {\n            entity.ToTable("operational_regions"); entity.HasKey(x => x.Id);\n            entity.Property(x => x.Name).HasMaxLength(160).IsRequired();\n            entity.Property(x => x.Code).HasMaxLength(32).IsRequired();\n            entity.Property(x => x.Description).HasMaxLength(500);\n            entity.HasOne<Organization>().WithMany().HasForeignKey(x => x.OrganizationId).OnDelete(DeleteBehavior.Cascade);\n            entity.HasIndex(x => x.OrganizationId);\n            entity.HasIndex(x => new { x.OrganizationId, x.Code }).IsUnique();\n            entity.HasIndex(x => new { x.OrganizationId, x.IsActive });\n        });\n        modelBuilder.Entity<FarmAccessAssignment>(entity =>\n        {\n            entity.ToTable("farm_access_assignments"); entity.HasKey(x => x.Id);\n            entity.Property(x => x.ScopeType).HasConversion<string>().HasMaxLength(32).IsRequired();\n            entity.Property(x => x.ScopeKey).HasMaxLength(100).IsRequired();\n            entity.HasOne<Organization>().WithMany().HasForeignKey(x => x.OrganizationId).OnDelete(DeleteBehavior.Cascade);\n            entity.HasOne<User>().WithMany().HasForeignKey(x => x.UserId).OnDelete(DeleteBehavior.Cascade);\n            entity.HasIndex(x => x.OrganizationId);\n            entity.HasIndex(x => x.UserId);\n            entity.HasIndex(x => x.TargetId);\n            entity.HasIndex(x => new { x.OrganizationId, x.UserId, x.ScopeKey }).IsUnique().HasFilter("\\\"IsActive\\\" = TRUE");\n        });\n        modelBuilder.Entity<Subscription>(entity =>\n        {\n'''
          replace('src/backend/AgroControl.Infrastructure/Persistence/AgroControlDbContext.cs', marker, mapping)

          old_farm = '''        modelBuilder.Entity<Farm>(entity =>\n        {\n            entity.ToTable("farms"); entity.HasKey(x => x.Id); entity.Property(x => x.Name).HasMaxLength(160).IsRequired(); entity.Property(x => x.TotalAreaHectares).HasPrecision(18, 4).IsRequired(); entity.Property(x => x.City).HasMaxLength(120); entity.Property(x => x.State).HasMaxLength(80);\n            entity.HasOne<Organization>().WithMany().HasForeignKey(x => x.OrganizationId).OnDelete(DeleteBehavior.Cascade); entity.HasIndex(x => x.OrganizationId); entity.HasIndex(x => new { x.OrganizationId, x.Name });\n        });\n'''
          new_farm = '''        modelBuilder.Entity<Farm>(entity =>\n        {\n            entity.ToTable("farms"); entity.HasKey(x => x.Id);\n            entity.Property(x => x.Name).HasMaxLength(160).IsRequired();\n            entity.Property(x => x.TotalAreaHectares).HasPrecision(18, 4).IsRequired();\n            entity.Property(x => x.City).HasMaxLength(120);\n            entity.Property(x => x.State).HasMaxLength(80);\n            entity.Property(x => x.CountryCode).HasMaxLength(2).IsRequired();\n            entity.Property(x => x.StateCode).HasMaxLength(2);\n            entity.Property(x => x.MunicipalityCode).HasMaxLength(24);\n            entity.Property(x => x.PostalCode).HasMaxLength(20);\n            entity.Property(x => x.Latitude).HasPrecision(9, 6);\n            entity.Property(x => x.Longitude).HasPrecision(9, 6);\n            entity.Property(x => x.TimeZoneId).HasMaxLength(80).IsRequired();\n            entity.HasOne<Organization>().WithMany().HasForeignKey(x => x.OrganizationId).OnDelete(DeleteBehavior.Cascade);\n            entity.HasOne<OperationalRegion>().WithMany().HasForeignKey(x => x.OperationalRegionId).OnDelete(DeleteBehavior.SetNull);\n            entity.HasIndex(x => x.OrganizationId);\n            entity.HasIndex(x => x.OperationalRegionId);\n            entity.HasIndex(x => new { x.OrganizationId, x.Name });\n            entity.HasIndex(x => new { x.OrganizationId, x.CountryCode, x.StateCode });\n        });\n'''
          replace('src/backend/AgroControl.Infrastructure/Persistence/AgroControlDbContext.cs', old_farm, new_farm)

          # Dependency injection
          replace(
              'src/backend/AgroControl.Infrastructure/DependencyInjection.cs',
              'using AgroControl.Application.Production;\n',
              'using AgroControl.Application.Production;\nusing AgroControl.Application.RegionalOperations;\n')
          replace(
              'src/backend/AgroControl.Infrastructure/DependencyInjection.cs',
              '        services.AddScoped<IProductionRepository, ProductionRepository>();\n',
              '        services.AddScoped<IProductionRepository, ProductionRepository>();\n        services.AddScoped<IMultiFarmRepository, MultiFarmRepository>();\n        services.AddScoped<IFarmAccessScope, FarmAccessScopeService>();\n')

          # API services, route and version
          replace(
              'src/backend/AgroControl.Api/Program.cs',
              'using AgroControl.Application.Production;\n',
              'using AgroControl.Application.Production;\nusing AgroControl.Application.RegionalOperations;\n')
          replace(
              'src/backend/AgroControl.Api/Program.cs',
              'builder.Services.AddScoped<FarmService>();\n',
              'builder.Services.AddScoped<FarmService>();\nbuilder.Services.AddScoped<MultiFarmService>();\n')
          replace(
              'src/backend/AgroControl.Api/Program.cs',
              'version = "0.17.0"',
              'version = "0.18.0"')
          replace(
              'src/backend/AgroControl.Api/Program.cs',
              'app.MapProductionEndpoints();\n',
              'app.MapProductionEndpoints();\napp.MapMultiFarmEndpoints();\n')

          # Registration creates an explicit AllFarms grant for the first owner.
          replace(
              'src/backend/AgroControl.Application/Identity/AuthService.cs',
              'using AgroControl.Application.Subscriptions;\n',
              'using AgroControl.Application.Subscriptions;\nusing AgroControl.Application.RegionalOperations;\n')
          replace(
              'src/backend/AgroControl.Application/Identity/AuthService.cs',
              'using AgroControl.Domain.Modules.Organizations;\n',
              'using AgroControl.Domain.Modules.Organizations;\nusing AgroControl.Domain.Modules.Operations;\n')
          replace(
              'src/backend/AgroControl.Application/Identity/AuthService.cs',
              '    private readonly ISubscriptionRepository _subscriptionRepository;\n',
              '    private readonly ISubscriptionRepository _subscriptionRepository;\n    private readonly IMultiFarmRepository _multiFarmRepository;\n')
          replace(
              'src/backend/AgroControl.Application/Identity/AuthService.cs',
              '        ISubscriptionRepository subscriptionRepository,\n        IPasswordHasher passwordHasher,',
              '        ISubscriptionRepository subscriptionRepository,\n        IMultiFarmRepository multiFarmRepository,\n        IPasswordHasher passwordHasher,')
          replace(
              'src/backend/AgroControl.Application/Identity/AuthService.cs',
              '        _subscriptionRepository = subscriptionRepository;\n',
              '        _subscriptionRepository = subscriptionRepository;\n        _multiFarmRepository = multiFarmRepository;\n')
          replace(
              'src/backend/AgroControl.Application/Identity/AuthService.cs',
              '        var subscription = Subscription.CreateBasic(organization.Id, now);\n',
              '        var subscription = Subscription.CreateBasic(organization.Id, now);\n        var allFarmsAccess = FarmAccessAssignment.CreateAllFarms(organization.Id, user.Id, user.Id, now);\n')
          replace(
              'src/backend/AgroControl.Application/Identity/AuthService.cs',
              '        _subscriptionRepository.Add(subscription);\n',
              '        _subscriptionRepository.Add(subscription);\n        _multiFarmRepository.AddAssignment(allFarmsAccess);\n')
          PY

      - name: Restore and build
        run: |
          dotnet restore AgroControl.sln
          dotnet build AgroControl.sln --configuration Debug --no-restore

      - name: Generate MultiFarmRegionalOperations migration
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.0
          dotnet ef migrations add MultiFarmRegionalOperations --project src/backend/AgroControl.Infrastructure --startup-project src/backend/AgroControl.Infrastructure --no-build

      - name: Backfill legacy location and explicit owner/admin scope
        run: |
          python - <<'PY'
          from pathlib import Path
          migrations = sorted(Path('src/backend/AgroControl.Infrastructure/Persistence/Migrations').glob('*_MultiFarmRegionalOperations.cs'))
          if len(migrations) != 1:
              raise SystemExit(f'expected one migration, found {len(migrations)}')
          p = migrations[0]
          s = p.read_text()
          marker = '\n        }\n\n        /// <inheritdoc />\n        protected override void Down'
          if marker not in s:
              raise SystemExit('migration Up/Down marker not found')
          sql = '''\n            migrationBuilder.Sql("""\n                UPDATE farms\n                SET \"CountryCode\" = 'BR'\n                WHERE \"CountryCode\" = '';\n\n                UPDATE farms\n                SET \"StateCode\" = UPPER(\"State\")\n                WHERE \"StateCode\" IS NULL AND \"State\" IS NOT NULL;\n\n                UPDATE farms\n                SET \"TimeZoneId\" = 'America/Sao_Paulo'\n                WHERE \"TimeZoneId\" = '';\n\n                INSERT INTO farm_access_assignments\n                    (\"Id\", \"OrganizationId\", \"UserId\", \"ScopeType\", \"TargetId\", \"ScopeKey\", \"IsActive\", \"CreatedByUserId\", \"CreatedAtUtc\", \"RevokedByUserId\", \"RevokedAtUtc\")\n                SELECT gen_random_uuid(), m.\"OrganizationId\", m.\"UserId\", 'AllFarms', NULL, 'all', TRUE, m.\"UserId\", NOW(), NULL, NULL\n                FROM organization_memberships m\n                WHERE m.\"Role\" IN ('Owner', 'Admin')\n                  AND NOT EXISTS (\n                      SELECT 1 FROM farm_access_assignments a\n                      WHERE a.\"OrganizationId\" = m.\"OrganizationId\"\n                        AND a.\"UserId\" = m.\"UserId\"\n                        AND a.\"ScopeKey\" = 'all'\n                        AND a.\"IsActive\" = TRUE\n                  );\n                """);\n'''
          s = s.replace(marker, sql + marker, 1)
          p.write_text(s)
          PY

      - name: Validate backend
        run: dotnet test AgroControl.sln --configuration Release --no-restore

      - name: Commit generated foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat(multi-farm): wire persistence and migration"
          git push origin HEAD:feat/sprint-18-multi-farm
