name: Intelligence CI

on:
  push:
    paths:
      - "src/intelligence/**"
      - ".github/workflows/intelligence-ci.yml"
  pull_request:
    paths:
      - "src/intelligence/**"
      - ".github/workflows/intelligence-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/intelligence

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/intelligence/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q
