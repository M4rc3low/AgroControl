name: Intelligence CI

on:
  push:
    paths:
      - "src/intelligence/**"
      - ".github/workflows/intelligence-ci.yml"
  pull_request:
    paths:
      - "src/intelligence/**"
      - ".github/workflows/intelligence-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/intelligence

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/intelligence/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

      - name: Build Docker image
        working-directory: .
        run: docker build -f src/intelligence/Dockerfile -t agrocontrol-intelligence:test .

      - name: Smoke test container health
        working-directory: .
        run: |
          docker run -d --rm --name agrocontrol-intelligence-test -p 8090:8090 agrocontrol-intelligence:test
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8090/health > /tmp/intelligence-health.json; then
              cat /tmp/intelligence-health.json
              docker stop agrocontrol-intelligence-test
              exit 0
            fi
            sleep 1
          done
          docker logs agrocontrol-intelligence-test
          docker stop agrocontrol-intelligence-test || true
          exit 1
