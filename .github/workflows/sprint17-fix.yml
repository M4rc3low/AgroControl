name: Sprint 17 Fix

on:
  push:
    branches: ["feat/sprint-17-raster-processing"]
    paths: [".github/workflows/sprint17-fix.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sprint-17-raster-processing
      - name: Fix repository compile guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/backend/AgroControl.Infrastructure/Persistence/RasterProcessingRepository.cs')
          s = p.read_text()
          needle = '''                var duplicate = await GetRunByKeyAsync(organizationId, run.ProcessingKey, cancellationToken)
                    ?? throw;'''
          replacement = '''                var duplicate = await GetRunByKeyAsync(organizationId, run.ProcessingKey, cancellationToken);
                if (duplicate is null) throw;'''
          if needle not in s:
              raise SystemExit('compile guard marker not found')
          p.write_text(s.replace(needle, replacement, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/AgroControl.Infrastructure/Persistence/RasterProcessingRepository.cs
          git commit -m "fix(raster): handle idempotency race without invalid throw expression"
          git push origin HEAD:feat/sprint-17-raster-processing
