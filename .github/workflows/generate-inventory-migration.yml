name: Generate Inventory Migration

on:
  push:
    branches:
      - "feat/sprint-3-inventory"
    paths:
      - "src/backend/AgroControl.Domain/Modules/Inventory/**"
      - "src/backend/AgroControl.Infrastructure/Persistence/AgroControlDbContext.cs"
      - ".github/workflows/generate-inventory-migration.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/sprint-3-inventory

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AgroControl.sln

      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.0

      - name: Generate migration
        run: >-
          dotnet ef migrations add InventoryCore
          --project src/backend/AgroControl.Infrastructure/AgroControl.Infrastructure.csproj
          --startup-project src/backend/AgroControl.Infrastructure/AgroControl.Infrastructure.csproj
          --output-dir Persistence/Migrations

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/AgroControl.Infrastructure/Persistence/Migrations
          git commit -m "db: add InventoryCore migration"
          git push origin HEAD:feat/sprint-3-inventory
