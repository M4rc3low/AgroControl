name: Generate Inventory Migration

on:
  push:
    branches:
      - "feat/sprint-3-inventory"
    paths:
      - "src/backend/AgroControl.Domain/Modules/Inventory/**"
      - "src/backend/AgroControl.Infrastructure/Persistence/AgroControlDbContext.cs"
      - ".github/workflows/generate-inventory-migration.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AgroControl.sln

      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.0

      - name: Generate migration
        run: >-
          dotnet ef migrations add InventoryCore
          --project src/backend/AgroControl.Infrastructure/AgroControl.Infrastructure.csproj
          --startup-project src/backend/AgroControl.Api/AgroControl.Api.csproj
          --output-dir Persistence/Migrations

      - name: Upload generated migration
        uses: actions/upload-artifact@v4
        with:
          name: inventory-migration
          path: src/backend/AgroControl.Infrastructure/Persistence/Migrations
          if-no-files-found: error
