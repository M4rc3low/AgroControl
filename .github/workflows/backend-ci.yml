name: Backend CI

on:
  push:
    paths:
      - "src/backend/**"
      - "tests/backend/**"
      - "AgroControl.sln"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "src/backend/**"
      - "tests/backend/**"
      - "AgroControl.sln"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: agrocontrol_test
          POSTGRES_USER: agrocontrol
          POSTGRES_PASSWORD: agrocontrol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrocontrol -d agrocontrol_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AGROCONTROL_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=agrocontrol_test;Username=agrocontrol;Password=agrocontrol_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore AgroControl.sln

      - name: Build
        run: dotnet build AgroControl.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AgroControl.sln --configuration Release --no-build --verbosity normal
