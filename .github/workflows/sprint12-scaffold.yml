name: Sprint 12 Scaffold

on:
  push:
    branches: ["feat/sprint-12-sustainability"]
    paths: [".github/workflows/sprint12-scaffold.yml"]

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sprint-12-sustainability
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wire sustainability module
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'marker not found: {path}: {old[:80]}')
              p.write_text(s.replace(old, new, 1))

          p = Path('src/backend/AgroControl.Infrastructure/Persistence/AgroControlDbContext.cs')
          s = p.read_text()
          s = s.replace('using AgroControl.Domain.Modules.Subscriptions;\n', 'using AgroControl.Domain.Modules.Subscriptions;\nusing AgroControl.Domain.Modules.Sustainability;\n', 1)
          s = s.replace('    public DbSet<IrrigationApplication> IrrigationApplications => Set<IrrigationApplication>();\n', '    public DbSet<IrrigationApplication> IrrigationApplications => Set<IrrigationApplication>();\n    public DbSet<EmissionFactor> EmissionFactors => Set<EmissionFactor>();\n    public DbSet<EmissionActivity> EmissionActivities => Set<EmissionActivity>();\n', 1)
          idx = s.rfind('    }\n}')
          if idx < 0:
              raise SystemExit('DbContext closing marker not found')
          mapping = '''        modelBuilder.Entity<EmissionFactor>(entity =>\n        {\n            entity.ToTable("emission_factors"); entity.HasKey(x => x.Id);\n            entity.Property(x => x.Name).HasMaxLength(160).IsRequired();\n            entity.Property(x => x.Category).HasConversion<string>().HasMaxLength(32).IsRequired();\n            entity.Property(x => x.Unit).HasMaxLength(32).IsRequired();\n            entity.Property(x => x.KgCo2ePerUnit).HasPrecision(18, 6).IsRequired();\n            entity.Property(x => x.MethodologyReference).HasMaxLength(500).IsRequired();\n            entity.Property(x => x.Notes).HasMaxLength(1000);\n            entity.HasOne<Organization>().WithMany().HasForeignKey(x => x.OrganizationId).OnDelete(DeleteBehavior.Cascade);\n            entity.HasIndex(x => x.OrganizationId);\n            entity.HasIndex(x => new { x.OrganizationId, x.Name }).IsUnique();\n            entity.HasIndex(x => new { x.OrganizationId, x.Category, x.IsActive });\n        });\n        modelBuilder.Entity<EmissionActivity>(entity =>\n        {\n            entity.ToTable("emission_activities"); entity.HasKey(x => x.Id);\n            entity.Property(x => x.FactorNameSnapshot).HasMaxLength(160).IsRequired();\n            entity.Property(x => x.CategorySnapshot).HasConversion<string>().HasMaxLength(32).IsRequired();\n            entity.Property(x => x.UnitSnapshot).HasMaxLength(32).IsRequired();\n            entity.Property(x => x.FactorKgCo2ePerUnitSnapshot).HasPrecision(18, 6).IsRequired();\n            entity.Property(x => x.Quantity).HasPrecision(18, 6).IsRequired();\n            entity.Property(x => x.EmissionsKgCo2e).HasPrecision(18, 6).IsRequired();\n            entity.Property(x => x.Origin).HasConversion<string>().HasMaxLength(32).IsRequired();\n            entity.Property(x => x.DataQuality).HasConversion<string>().HasMaxLength(32).IsRequired();\n            entity.Property(x => x.Description).HasMaxLength(240).IsRequired();\n            entity.Property(x => x.SourceModule).HasMaxLength(64);\n            entity.Property(x => x.SourceReferenceId).HasMaxLength(160);\n            entity.Property(x => x.Notes).HasMaxLength(1000);\n            entity.Ignore(x => x.EmissionsTCo2e);\n            entity.HasOne<Organization>().WithMany().HasForeignKey(x => x.OrganizationId).OnDelete(DeleteBehavior.Cascade);\n            entity.HasOne<EmissionFactor>().WithMany().HasForeignKey(x => x.EmissionFactorId).OnDelete(DeleteBehavior.Restrict);\n            entity.HasOne<Farm>().WithMany().HasForeignKey(x => x.FarmId).OnDelete(DeleteBehavior.Restrict);\n            entity.HasOne<Field>().WithMany().HasForeignKey(x => x.FieldId).OnDelete(DeleteBehavior.Restrict);\n            entity.HasOne<Season>().WithMany().HasForeignKey(x => x.SeasonId).OnDelete(DeleteBehavior.Restrict);\n            entity.HasIndex(x => x.OrganizationId);\n            entity.HasIndex(x => x.EmissionFactorId);\n            entity.HasIndex(x => x.FarmId); entity.HasIndex(x => x.FieldId); entity.HasIndex(x => x.SeasonId);\n            entity.HasIndex(x => new { x.OrganizationId, x.ActivityDate });\n            entity.HasIndex(x => new { x.OrganizationId, x.CategorySnapshot, x.ActivityDate });\n            entity.HasIndex(x => new { x.OrganizationId, x.SourceModule, x.SourceReferenceId }).IsUnique().HasFilter("\\\"SourceModule\\\" IS NOT NULL AND \\\"SourceReferenceId\\\" IS NOT NULL");\n        });\n'''
          s = s[:idx] + mapping + s[idx:]
          p.write_text(s)

          replace('src/backend/AgroControl.Infrastructure/DependencyInjection.cs', 'using AgroControl.Application.Subscriptions;\n', 'using AgroControl.Application.Subscriptions;\nusing AgroControl.Application.Sustainability;\n')
          replace('src/backend/AgroControl.Infrastructure/DependencyInjection.cs', '        services.AddScoped<IIrrigationRepository, IrrigationRepository>();\n', '        services.AddScoped<IIrrigationRepository, IrrigationRepository>();\n        services.AddScoped<ISustainabilityRepository, SustainabilityRepository>();\n')

          replace('src/backend/AgroControl.Api/Program.cs', 'using AgroControl.Application.Subscriptions;\n', 'using AgroControl.Application.Subscriptions;\nusing AgroControl.Application.Sustainability;\n')
          replace('src/backend/AgroControl.Api/Program.cs', 'builder.Services.AddScoped<IrrigationService>();\n', 'builder.Services.AddScoped<IrrigationService>();\nbuilder.Services.AddScoped<SustainabilityService>();\n')
          replace('src/backend/AgroControl.Api/Program.cs', 'version = "0.11.0"', 'version = "0.12.0"')
          replace('src/backend/AgroControl.Api/Program.cs', 'app.MapIrrigationEndpoints();\n', 'app.MapIrrigationEndpoints();\napp.MapSustainabilityEndpoints();\n')

          replace('src/backend/AgroControl.Application/Platform/ModuleCatalog.cs', 'new(ModuleKey.Sustainability, "Sustainability", ModuleStatus.Locked, "Indicadores ambientais e carbono."),', 'new(ModuleKey.Sustainability, "Sustainability", ModuleStatus.Active, "Emissões estimadas, CO₂e e indicadores ambientais."),')

          replace('src/frontend/src/App.tsx', "import { IrrigationPage } from './pages/IrrigationPage';\n", "import { IrrigationPage } from './pages/IrrigationPage';\nimport { SustainabilityPage } from './pages/SustainabilityPage';\n")
          replace('src/frontend/src/App.tsx', '          <Route path="irrigation" element={<IrrigationPage />} />\n', '          <Route path="irrigation" element={<IrrigationPage />} />\n          <Route path="sustainability" element={<SustainabilityPage />} />\n')
          replace('src/frontend/src/components/AppShell.tsx', "  { to: '/irrigation', label: 'Irrigação', icon: 'droplet' as const, module: 'Irrigation' },\n", "  { to: '/irrigation', label: 'Irrigação', icon: 'droplet' as const, module: 'Irrigation' },\n  { to: '/sustainability', label: 'Sustentabilidade', icon: 'leaf' as const, module: 'Sustainability' },\n")
          PY
      - name: Restore backend
        run: dotnet restore AgroControl.sln
      - name: Build debug for EF
        run: dotnet build AgroControl.sln --configuration Debug --no-restore
      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.0
      - name: Generate SustainabilityCore migration
        run: dotnet ef migrations add SustainabilityCore --project src/backend/AgroControl.Infrastructure --startup-project src/backend/AgroControl.Infrastructure --no-build
      - name: Validate backend
        run: dotnet test AgroControl.sln --configuration Release --no-restore
      - name: Validate frontend
        working-directory: src/frontend
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Commit generated wiring and migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "feat(sustainability): wire module and generate migration"
          git push origin HEAD:feat/sprint-12-sustainability
