name: Telemetry CI

on:
  push:
    paths:
      - "src/telemetry/**"
      - "infra/mosquitto/**"
      - ".github/workflows/telemetry-ci.yml"
  pull_request:
    paths:
      - "src/telemetry/**"
      - "infra/mosquitto/**"
      - ".github/workflows/telemetry-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/telemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: mvn -B verify
      - name: Build Docker image
        working-directory: .
        run: docker build -f src/telemetry/Dockerfile -t agrocontrol-telemetry:test .
