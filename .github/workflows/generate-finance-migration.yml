# Temporary migration generator for Sprint 4.
name: Generate Finance Migration

on:
  push:
    branches:
      - "feat/sprint-4-finance"
    paths:
      - "src/backend/AgroControl.Domain/Modules/Finance/**"
      - "src/backend/AgroControl.Infrastructure/Persistence/AgroControlDbContext.cs"
      - ".github/workflows/generate-finance-migration.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AgroControl.sln

      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.0

      - name: Generate migration
        run: >-
          dotnet ef migrations add FinanceCore
          --project src/backend/AgroControl.Infrastructure/AgroControl.Infrastructure.csproj
          --startup-project src/backend/AgroControl.Infrastructure/AgroControl.Infrastructure.csproj
          --output-dir Persistence/Migrations

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/AgroControl.Infrastructure/Persistence/Migrations
          git diff --cached --quiet && exit 0
          git commit -m "db: add FinanceCore migration"
          git push
