name: Sprint 18 Hardening

on:
  push:
    branches:
      - feat/sprint-18-multi-farm
    paths:
      - .github/workflows/sprint18-hardening.yml
      - scripts/sprint18_hardening.py

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/sprint-18-multi-farm
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply hardening patch
        run: python scripts/sprint18_hardening.py
      - name: Restore
        run: dotnet restore AgroControl.sln
      - name: Build
        run: dotnet build AgroControl.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test AgroControl.sln --configuration Release --no-build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend
          git commit -m "feat(multi-farm): enforce operational scope across EF modules"
          git push origin HEAD:feat/sprint-18-multi-farm
