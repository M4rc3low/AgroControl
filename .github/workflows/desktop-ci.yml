name: Desktop CI

on:
  push:
    paths:
      - "src/frontend/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "src/frontend/**"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      # Development/CI endpoint only. A production desktop release must provide the real HTTPS API base URL.
      VITE_API_BASE_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci --no-audit --no-fund

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/frontend/src-tauri -> target"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build Windows installers
        working-directory: src/frontend
        run: cargo tauri build

      - name: Upload unsigned Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: agrocontrol-windows-unsigned
          if-no-files-found: error
          path: |
            src/frontend/src-tauri/target/release/bundle/nsis/*.exe
            src/frontend/src-tauri/target/release/bundle/msi/*.msi
