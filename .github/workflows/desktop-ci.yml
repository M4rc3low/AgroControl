name: Desktop CI

on:
  push:
    paths:
      - "src/frontend/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "src/frontend/**"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      # Development/CI endpoint only. A production desktop release must provide the real HTTPS API base URL.
      VITE_API_BASE_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci --no-audit --no-fund

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/frontend/src-tauri -> target"

      - name: Build unsigned Windows installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src/frontend
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: agrocontrol-windows-unsigned-[bundle]
