name: Sprint 14 Polish

on:
  push:
    branches: ["feat/sprint-14-commercial-crm"]
    paths: [".github/workflows/sprint14-polish.yml"]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sprint-14-commercial-crm
          fetch-depth: 0
      - name: Finalize Sprint 14 docs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'marker not found: {path}: {old[:120]}')
              p.write_text(s.replace(old, new, 1))

          replace('README.md',
              '> Status atual: **Sprint 13 concluída — Exportação, câmbio, documentos e logística internacional**',
              '> Status atual: **Sprint 14 concluída — Comercial e CRM, clientes, contatos e pipeline de vendas**')
          replace('README.md',
              '- pedidos de exportação, câmbio, documentação e custos logísticos;\n- evolução futura para sensoriamento remoto, CRM e análises agronômicas avançadas.',
              '- pedidos de exportação, câmbio, documentação e custos logísticos;\n- clientes, contatos, oportunidades e pipeline comercial;\n- evolução futura para sensoriamento remoto e análises agronômicas avançadas.')
          replace('README.md',
              '- workspace de exportação com pedidos, câmbio, logística, custos, documentos e timeline operacional;\n- layout para desktop, tablet e mobile;',
              '- workspace de exportação com pedidos, câmbio, logística, custos, documentos e timeline operacional;\n- workspace comercial com clientes, contatos, oportunidades, pipeline e histórico de etapas;\n- layout para desktop, tablet e mobile;')

          export_marker = 'O módulo é **operacional e gerencial**. Não substitui Siscomex, despachante aduaneiro, emissão fiscal, contratação bancária de câmbio ou documentos oficiais.\n\n### Estoque'
          commercial_section = '''O módulo é **operacional e gerencial**. Não substitui Siscomex, despachante aduaneiro, emissão fiscal, contratação bancária de câmbio ou documentos oficiais.\n\n### Comercial e CRM\n\n- clientes com status `Lead`, `Prospect`, `Customer` e `Inactive`;\n- contatos vinculados a clientes, com contato principal e desativação lógica;\n- oportunidades com valor esperado, moeda ISO 4217, probabilidade, responsável e próximo passo;\n- pipeline `Lead`, `Qualification`, `Proposal`, `Negotiation`, `Won` e `Lost`;\n- `Won` e `Lost` como estados terminais no MVP;\n- timeline append-only das mudanças de etapa;\n- vínculos opcionais com propriedade, cultura, safra e pedido de exportação;\n- resumo de oportunidades, ganhos, perdas, conversão e pipeline ponderado separado por moeda;\n- isolamento multi-tenant e proteção pelo entitlement `Commercial`.\n\nO módulo é **gerencial**. Não substitui contrato comercial, faturamento, emissão fiscal, assinatura eletrônica ou um CRM omnichannel.\n\n### Estoque'''
          replace('README.md', export_marker, commercial_section)
          replace('README.md', '/api/v1/export/*\n/api/v1/inventory/*', '/api/v1/export/*\n/api/v1/commercial/*\n/api/v1/inventory/*')
          replace('README.md',
              '- [`docs/SPRINT_13_EXPORT.md`](docs/SPRINT_13_EXPORT.md)\n- [`docs/ROADMAP.md`](docs/ROADMAP.md)',
              '- [`docs/SPRINT_13_EXPORT.md`](docs/SPRINT_13_EXPORT.md)\n- [`docs/SPRINT_14_COMMERCIAL.md`](docs/SPRINT_14_COMMERCIAL.md)\n- [`docs/ROADMAP.md`](docs/ROADMAP.md)')
          replace('README.md',
              '14. ✅ **Sprint 13** — exportação, câmbio, documentos, logística e custos internacionais.\n\nO hardening',
              '14. ✅ **Sprint 13** — exportação, câmbio, documentos, logística e custos internacionais.\n15. ✅ **Sprint 14** — comercial e CRM, clientes, contatos, oportunidades e pipeline de vendas.\n\nO hardening')

          sprint14 = '''## Sprint 14 — Comercial e CRM ✅\n\n- [x] módulo `Commercial` com entitlement próprio;\n- [x] clientes por organização e status de relacionamento;\n- [x] contatos vinculados, principal e desativação lógica;\n- [x] oportunidades com valor, moeda, probabilidade, responsável e próximo passo;\n- [x] pipeline com transições explícitas e `Won`/`Lost` terminais;\n- [x] timeline append-only das mudanças de etapa;\n- [x] vínculos opcionais com Farm, Crop, Season e ExportOrder;\n- [x] validação de todos os vínculos no mesmo `OrganizationId`;\n- [x] resumo de pipeline, ganhos, perdas e conversão;\n- [x] valores resumidos por moeda, sem agregação incorreta entre moedas;\n- [x] API protegida pelo entitlement `Commercial`;\n- [x] interface web responsiva para clientes, contatos e oportunidades;\n- [x] migration `CommercialCore`, índices e model snapshot;\n- [x] testes unitários e integração PostgreSQL;\n- [x] documentação da Sprint 14.\n\n## Próximos aprimoramentos'''
          replace('docs/ROADMAP.md', '## Próximos aprimoramentos', sprint14)
          replace('docs/ROADMAP.md',
              'As próximas evoluções funcionais podem avançar para CRM/comercial, importação de geometrias, imagens de satélite/drone, índices vegetativos, zonas de manejo e aprofundamento agronômico do balanço hídrico, mantendo cada responsabilidade em uma sprint separada.',
              'As próximas evoluções funcionais podem avançar para importação de geometrias, imagens de satélite/drone, índices vegetativos, zonas de manejo e aprofundamento agronômico do balanço hídrico, mantendo cada responsabilidade em uma sprint separada.')
          PY
      - name: Remove temporary Sprint workflows
        run: git rm .github/workflows/sprint14-scaffold.yml .github/workflows/sprint14-polish.yml
      - name: Commit final documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md .github/workflows
          git commit -m "docs: finalize Sprint 14 commercial delivery"
          git fetch origin feat/sprint-14-commercial-crm
          git rebase origin/feat/sprint-14-commercial-crm
          git push origin HEAD:feat/sprint-14-commercial-crm
