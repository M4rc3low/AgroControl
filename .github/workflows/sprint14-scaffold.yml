name: Sprint 14 Scaffold

on:
  push:
    branches: ["feat/sprint-14-commercial-crm"]
    paths: [".github/workflows/sprint14-scaffold.yml"]

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: agrocontrol_test
          POSTGRES_USER: agrocontrol
          POSTGRES_PASSWORD: agrocontrol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrocontrol -d agrocontrol_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGROCONTROL_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=agrocontrol_test;Username=agrocontrol;Password=agrocontrol_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sprint-14-commercial-crm
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wire commercial module
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'marker not found: {path}: {old[:100]}')
              p.write_text(s.replace(old,new,1))

          replace('src/backend/AgroControl.Domain/Platform/ModuleKey.cs', '    Sustainability,\n    Export,', '    Sustainability,\n    Commercial,\n    Export,')
          replace('src/backend/AgroControl.Application/Platform/ModuleCatalog.cs', '        new(ModuleKey.Sustainability, "Sustainability", ModuleStatus.Active, "Emissões estimadas, CO₂e e indicadores ambientais."),\n        new(ModuleKey.Export,', '        new(ModuleKey.Sustainability, "Sustainability", ModuleStatus.Active, "Emissões estimadas, CO₂e e indicadores ambientais."),\n        new(ModuleKey.Commercial, "Commercial", ModuleStatus.Active, "Clientes, contatos, oportunidades e pipeline comercial."),\n        new(ModuleKey.Export,')
          replace('src/backend/AgroControl.Application/Subscriptions/PlanEntitlementCatalog.cs', '        ModuleKey.Sustainability\n    ];', '        ModuleKey.Sustainability,\n        ModuleKey.Commercial\n    ];')

          p=Path('src/backend/AgroControl.Infrastructure/Persistence/AgroControlDbContext.cs'); s=p.read_text()
          s=s.replace('using AgroControl.Domain.Modules.Crops;\n', 'using AgroControl.Domain.Modules.Crops;\nusing AgroControl.Domain.Modules.Commercial;\n',1)
          s=s.replace('    public DbSet<ExportOrderStatusEvent> ExportOrderStatusEvents => Set<ExportOrderStatusEvent>();\n', '    public DbSet<ExportOrderStatusEvent> ExportOrderStatusEvents => Set<ExportOrderStatusEvent>();\n    public DbSet<CommercialCustomer> CommercialCustomers => Set<CommercialCustomer>();\n    public DbSet<CommercialContact> CommercialContacts => Set<CommercialContact>();\n    public DbSet<CommercialOpportunity> CommercialOpportunities => Set<CommercialOpportunity>();\n    public DbSet<OpportunityStageEvent> OpportunityStageEvents => Set<OpportunityStageEvent>();\n',1)
          idx=s.rfind('    }\n}')
          mapping='''        modelBuilder.Entity<CommercialCustomer>(entity =>\n        {\n            entity.ToTable("commercial_customers"); entity.HasKey(x => x.Id);\n            entity.Property(x => x.Name).HasMaxLength(200).IsRequired();\n            entity.Property(x => x.TradeName).HasMaxLength(200);\n            entity.Property(x => x.TaxId).HasMaxLength(80);\n            entity.Property(x => x.Email).HasMaxLength(254);\n            entity.Property(x => x.Phone).HasMaxLength(60);\n            entity.Property(x => x.CountryCode).HasMaxLength(2);\n            entity.Property(x => x.City).HasMaxLength(120);\n            entity.Property(x => x.State).HasMaxLength(40);\n            entity.Property(x => x.Status).HasConversion<string>().HasMaxLength(32).IsRequired();\n            entity.Property(x => x.Notes).HasMaxLength(1200);\n            entity.Ignore(x => x.IsInactive);\n            entity.HasOne<Organization>().WithMany().HasForeignKey(x => x.OrganizationId).OnDelete(DeleteBehavior.Cascade);\n            entity.HasIndex(x => x.OrganizationId);\n            entity.HasIndex(x => new { x.OrganizationId, x.Status, x.Name });\n        });\n        modelBuilder.Entity<CommercialContact>(entity =>\n        {\n            entity.ToTable("commercial_contacts"); entity.HasKey(x => x.Id);\n            entity.Property(x => x.Name).HasMaxLength(160).IsRequired();\n            entity.Property(x => x.Role).HasMaxLength(120);\n            entity.Property(x => x.Email).HasMaxLength(254);\n            entity.Property(x => x.Phone).HasMaxLength(60);\n            entity.HasOne<Organization>().WithMany().HasForeignKey(x => x.OrganizationId).OnDelete(DeleteBehavior.Cascade);\n            entity.HasOne<CommercialCustomer>().WithMany().HasForeignKey(x => x.CustomerId).OnDelete(DeleteBehavior.Cascade);\n            entity.HasIndex(x => x.OrganizationId); entity.HasIndex(x => x.CustomerId);\n            entity.HasIndex(x => new { x.OrganizationId, x.CustomerId, x.IsActive });\n        });\n        modelBuilder.Entity<CommercialOpportunity>(entity =>\n        {\n            entity.ToTable("commercial_opportunities"); entity.HasKey(x => x.Id);\n            entity.Property(x => x.Title).HasMaxLength(240).IsRequired();\n            entity.Property(x => x.ExpectedValue).HasPrecision(18, 2).IsRequired();\n            entity.Property(x => x.Currency).HasMaxLength(3).IsRequired();\n            entity.Property(x => x.ProbabilityPercent).HasPrecision(5, 2).IsRequired();\n            entity.Property(x => x.Stage).HasConversion<string>().HasMaxLength(32).IsRequired();\n            entity.Property(x => x.OwnerName).HasMaxLength(160);\n            entity.Property(x => x.NextStep).HasMaxLength(500);\n            entity.Property(x => x.Notes).HasMaxLength(1200);\n            entity.Ignore(x => x.WeightedValue); entity.Ignore(x => x.IsTerminal);\n            entity.HasOne<Organization>().WithMany().HasForeignKey(x => x.OrganizationId).OnDelete(DeleteBehavior.Cascade);\n            entity.HasOne<CommercialCustomer>().WithMany().HasForeignKey(x => x.CustomerId).OnDelete(DeleteBehavior.Restrict);\n            entity.HasOne<Farm>().WithMany().HasForeignKey(x => x.FarmId).OnDelete(DeleteBehavior.Restrict);\n            entity.HasOne<Crop>().WithMany().HasForeignKey(x => x.CropId).OnDelete(DeleteBehavior.Restrict);\n            entity.HasOne<Season>().WithMany().HasForeignKey(x => x.SeasonId).OnDelete(DeleteBehavior.Restrict);\n            entity.HasOne<ExportOrder>().WithMany().HasForeignKey(x => x.ExportOrderId).OnDelete(DeleteBehavior.Restrict);\n            entity.HasIndex(x => x.OrganizationId); entity.HasIndex(x => x.CustomerId);\n            entity.HasIndex(x => new { x.OrganizationId, x.Stage, x.CreatedAtUtc });\n            entity.HasIndex(x => new { x.OrganizationId, x.Currency, x.CreatedAtUtc });\n            entity.HasIndex(x => x.FarmId); entity.HasIndex(x => x.CropId); entity.HasIndex(x => x.SeasonId); entity.HasIndex(x => x.ExportOrderId);\n        });\n        modelBuilder.Entity<OpportunityStageEvent>(entity =>\n        {\n            entity.ToTable("commercial_opportunity_stage_events"); entity.HasKey(x => x.Id);\n            entity.Property(x => x.FromStage).HasConversion<string>().HasMaxLength(32);\n            entity.Property(x => x.ToStage).HasConversion<string>().HasMaxLength(32).IsRequired();\n            entity.Property(x => x.Notes).HasMaxLength(1000);\n            entity.HasOne<Organization>().WithMany().HasForeignKey(x => x.OrganizationId).OnDelete(DeleteBehavior.Cascade);\n            entity.HasOne<CommercialOpportunity>().WithMany().HasForeignKey(x => x.OpportunityId).OnDelete(DeleteBehavior.Cascade);\n            entity.HasIndex(x => x.OrganizationId); entity.HasIndex(x => x.OpportunityId);\n            entity.HasIndex(x => new { x.OrganizationId, x.OpportunityId, x.OccurredOn });\n        });\n'''
          if idx < 0: raise SystemExit('DbContext closing marker not found')
          s=s[:idx]+mapping+s[idx:]; p.write_text(s)

          replace('src/backend/AgroControl.Infrastructure/DependencyInjection.cs', 'using AgroControl.Application.Common;\n', 'using AgroControl.Application.Common;\nusing AgroControl.Application.Commercial;\n')
          replace('src/backend/AgroControl.Infrastructure/DependencyInjection.cs', '        services.AddScoped<IExportRepository, ExportRepository>();\n', '        services.AddScoped<IExportRepository, ExportRepository>();\n        services.AddScoped<ICommercialRepository, CommercialRepository>();\n')
          replace('src/backend/AgroControl.Api/Program.cs', 'using AgroControl.Application.Finance;\n', 'using AgroControl.Application.Finance;\nusing AgroControl.Application.Commercial;\n')
          replace('src/backend/AgroControl.Api/Program.cs', 'builder.Services.AddScoped<ExportService>();\n', 'builder.Services.AddScoped<ExportService>();\nbuilder.Services.AddScoped<CommercialService>();\n')
          replace('src/backend/AgroControl.Api/Program.cs', 'version = "0.13.0"', 'version = "0.14.0"')
          replace('src/backend/AgroControl.Api/Program.cs', 'app.MapExportEndpoints();\n', 'app.MapExportEndpoints();\napp.MapCommercialEndpoints();\n')

          replace('src/frontend/src/App.tsx', "import { ExportPage } from './pages/ExportPage';\n", "import { ExportPage } from './pages/ExportPage';\nimport { CommercialPage } from './pages/CommercialPage';\n")
          replace('src/frontend/src/App.tsx', '          <Route path="export" element={<ExportPage />} />\n', '          <Route path="export" element={<ExportPage />} />\n          <Route path="commercial" element={<CommercialPage />} />\n')
          replace('src/frontend/src/components/AppShell.tsx', "  { to: '/export', label: 'Exportação', icon: 'box' as const, module: 'Export' },\n", "  { to: '/export', label: 'Exportação', icon: 'box' as const, module: 'Export' },\n  { to: '/commercial', label: 'Comercial', icon: 'chart' as const, module: 'Commercial' },\n")
          PY
      - name: Restore backend
        run: dotnet restore AgroControl.sln
      - name: Build backend for EF
        run: dotnet build AgroControl.sln --configuration Debug --no-restore
      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.0
      - name: Generate CommercialCore migration
        run: dotnet ef migrations add CommercialCore --project src/backend/AgroControl.Infrastructure --startup-project src/backend/AgroControl.Infrastructure --no-build
      - name: Validate backend
        run: dotnet test AgroControl.sln --configuration Release --no-restore
      - name: Validate frontend
        working-directory: src/frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit generated wiring and migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs README.md
          git commit -m "feat(commercial): wire module and generate migration"
          git fetch origin feat/sprint-14-commercial-crm
          git rebase origin/feat/sprint-14-commercial-crm
          git push origin HEAD:feat/sprint-14-commercial-crm
